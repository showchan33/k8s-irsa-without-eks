---
- name: Configure nodes for the external AWS cloud provider
  hosts: all
  become: true
  gather_facts: false

  tasks:
    - name: Read existing kubelet extra arguments
      ansible.builtin.slurp:
        path: /etc/default/kubelet
      register: kubelet_defaults
      failed_when: false

    - name: Extract existing kubelet extra arguments
      ansible.builtin.set_fact:
        kubelet_extra_args_declarations: >-
          {{
            kubelet_defaults.content | default('') | b64decode
            | regex_findall('(?m)^KUBELET_EXTRA_ARGS=(.*)$')
          }}
        kubelet_extra_args_existing: >-
          {{
            (
              kubelet_defaults.content | default('') | b64decode
              | regex_findall('(?m)^KUBELET_EXTRA_ARGS=(.*)$')
              | last | default('')
            )
            | regex_replace('^"|"$', '')
            | regex_replace("^'|'$", '')
          }}

    - name: Extract existing kubelet node labels
      ansible.builtin.set_fact:
        kubelet_node_labels_existing: >-
          {{
            kubelet_extra_args_existing
            | regex_findall('(?:^| )--node-labels(?:=| +)([^ ]+)')
            | first | default('')
          }}

    - name: Build managed kubelet node labels
      ansible.builtin.set_fact:
        kubelet_node_labels: >-
          {{
            (
              kubelet_node_labels_existing.split(',')
              + (
                ['node-role.kubernetes.io/control-plane=']
                if 'control_plane' in group_names else []
              )
            )
            | reject('equalto', '') | unique | join(',')
          }}

    - name: Remove existing managed arguments from kubelet extra arguments
      ansible.builtin.set_fact:
        kubelet_extra_args_without_managed: >-
          {{
            kubelet_extra_args_existing
            | regex_replace('(?:^| )--cloud-provider(?:=| +)[^ ]+', '')
            | regex_replace('(?:^| )--provider-id(?:=| +)[^ ]+', '')
            | regex_replace('(?:^| )--node-labels(?:=| +)[^ ]+', '')
            | trim
          }}

    - name: Build managed kubelet extra arguments
      ansible.builtin.set_fact:
        kubelet_extra_args_line: >-
          KUBELET_EXTRA_ARGS="{{
          ([
            kubelet_extra_args_without_managed,
            '--cloud-provider=external',
            '--provider-id=' ~ aws_provider_id,
            '--node-labels=' ~ kubelet_node_labels if kubelet_node_labels else '',
          ] | reject('equalto', '') | join(' '))
          }}"

    - name: Remove existing kubelet extra argument declarations
      ansible.builtin.lineinfile:
        path: /etc/default/kubelet
        create: true
        mode: "0644"
        regexp: '^KUBELET_EXTRA_ARGS='
        state: absent
      when: >-
        kubelet_extra_args_declarations | length != 1 or
        'KUBELET_EXTRA_ARGS=' ~ kubelet_extra_args_declarations[0] != kubelet_extra_args_line

    - name: Configure kubelet to use the external cloud provider
      ansible.builtin.lineinfile:
        path: /etc/default/kubelet
        create: true
        mode: "0644"
        insertafter: EOF
        line: "{{ kubelet_extra_args_line }}"
      when: >-
        kubelet_extra_args_declarations | length != 1 or
        'KUBELET_EXTRA_ARGS=' ~ kubelet_extra_args_declarations[0] != kubelet_extra_args_line
      notify: Restart kubelet

    - name: Configure kube-controller-manager to use the external cloud provider
      ansible.builtin.lineinfile:
        path: /etc/kubernetes/manifests/kube-controller-manager.yaml
        regexp: '^\s+- --cloud-provider='
        insertafter: '^\s+- kube-controller-manager$'
        line: '    - --cloud-provider=external'
      when: "'control_plane' in group_names"

    - name: Flush kubelet restart before validating the control plane
      ansible.builtin.meta: flush_handlers

    - name: Wait for the Kubernetes API to become ready
      ansible.builtin.command:
        cmd: kubectl --kubeconfig /etc/kubernetes/admin.conf get --raw=/readyz
      register: kubernetes_api_ready
      changed_when: false
      retries: 30
      delay: 5
      until: kubernetes_api_ready.rc == 0 and kubernetes_api_ready.stdout == "ok"
      when: "'control_plane' in group_names"

  handlers:
    - name: Restart kubelet
      ansible.builtin.systemd_service:
        name: kubelet
        state: restarted
