---
- name: Configure the Kubernetes service account OIDC issuer
  hosts: control_plane
  serial: 1
  become: true
  gather_facts: false

  vars:
    kube_apiserver_manifest: /etc/kubernetes/manifests/kube-apiserver.yaml
    kubectl_kubeconfig: /etc/kubernetes/admin.conf
    kubernetes_api_ready_retries: 60
    kubernetes_api_ready_delay: 5

  pre_tasks:
    - name: Validate the public OIDC issuer URL
      ansible.builtin.assert:
        that:
          - oidc_issuer_url is defined
          - oidc_issuer_url is match('^https://[^/\\s]+$')
        fail_msg: >-
          Set oidc_issuer_url to an HTTPS URL without a path, for example
          https://app.example.com.

  tasks:
    - name: Remove a malformed service account OIDC block from an earlier run
      ansible.builtin.replace:
        path: "{{ kube_apiserver_manifest }}"
        regexp: '(?ms)^\s*# BEGIN ANSIBLE MANAGED SERVICE ACCOUNT OIDC\n.*?^\s*# END ANSIBLE MANAGED SERVICE ACCOUNT OIDC\n?'
        replace: ''

    - name: Read the kube-apiserver manifest
      ansible.builtin.slurp:
        path: "{{ kube_apiserver_manifest }}"
      register: kube_apiserver_manifest_content

    - name: Extract existing service account issuers
      ansible.builtin.set_fact:
        existing_service_account_issuers: >-
          {{
            kube_apiserver_manifest_content.content | b64decode
            | regex_findall('(?m)^\s*- --service-account-issuer=([^\s]+)\s*$')
          }}

    - name: Determine whether the service account issuer must be updated
      ansible.builtin.set_fact:
        service_account_issuer_needs_update: >-
          {{ existing_service_account_issuers != [oidc_issuer_url] }}

    - name: Set the public service account JWKS URI argument
      ansible.builtin.lineinfile:
        path: "{{ kube_apiserver_manifest }}"
        insertafter: '^\s+- kube-apiserver\s*$'
        regexp: '^\s*- --service-account-jwks-uri=\S+\s*$'
        line: "    - --service-account-jwks-uri={{ oidc_issuer_url }}/openid/v1/jwks"

    - name: Remove existing service account issuer arguments
      ansible.builtin.lineinfile:
        path: "{{ kube_apiserver_manifest }}"
        regexp: '^\s*- --service-account-issuer=\S+\s*$'
        state: absent
      when: service_account_issuer_needs_update

    - name: Set the public service account issuer argument
      ansible.builtin.lineinfile:
        path: "{{ kube_apiserver_manifest }}"
        insertafter: '^\s+- kube-apiserver\s*$'
        line: "    - --service-account-issuer={{ oidc_issuer_url }}"
      when: service_account_issuer_needs_update

    - name: Wait for the Kubernetes API to become ready
      ansible.builtin.command:
        argv:
          - kubectl
          - --kubeconfig
          - "{{ kubectl_kubeconfig }}"
          - get
          - --raw=/readyz
      register: kubernetes_api_ready
      changed_when: false
      retries: "{{ kubernetes_api_ready_retries }}"
      delay: "{{ kubernetes_api_ready_delay }}"
      until: >-
        kubernetes_api_ready.rc == 0 and
        (kubernetes_api_ready.stdout | trim) == 'ok'
      tags:
        - api-readiness
